tools:
  Gh:
    description: |
      Executes a GitHub CLI (gh) command. Requires GITHUB_TOKEN in environment. Short results return inline; long or slow ones open a result panel. Panels of read-only commands (pr list, issue view, etc.) re-run when a later mutating gh command affects them. Mutating commands (pr create, issue close, gh api -f/--method POST, downloads, --web) run exactly once. Shell operators (|, ;, &&) are not allowed.
    parameters:
      command: "Full gh command string (e.g., 'gh pr list', 'gh issue view 42')"
