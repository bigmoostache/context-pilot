M-long-10:
  tier: long
  title: 'CI Frontend red: exit-1'
  contents: |-
    CI Frontend red: exit-1 always prints after the LAST header (knip) because check-ts-lints.sh aggregates 8 sub-checks. Never infer the culprit from the error's position — grep the whole log. knip falsely blamed twice; prettier was the real cause.

    THE TRAP (hit twice: T648 2026-07-22, T672 2026-07-27 — user furious the 2nd time, ~200 wasted tool calls).

    MECHANISM: .github/checks/check-ts-lints.sh uses `set -uo pipefail` (NO -e) and runs all 8 sub-checks unconditionally:
      eslint · prettier --check · stylelint · tsc -b · type-coverage · suppressions · rule-census · knip
    Each failure does `|| fail=1`; the script then `exit "$fail"` at the very end. GitHub prints `##[error]Process completed with exit code 1` at the moment the STEP ends — i.e. always after the last section header, `=== dead code (knip) ===`. This makes knip look guilty every single time regardless of the true culprit.

    CORRECT PROTOCOL when the Frontend job is red:
    1. Fetch the full job log (GitHub REST: /actions/jobs/<id>/logs — gh CLI is NOT installed, M156).
    2. `grep -n "^2.*=== "` to list every section header with line numbers.
    3. Read the BODY between each pair of headers. A failing sub-check prints its own diagnostics there (`[warn] <file>` for prettier, rule violations for eslint, `error TS####` for tsc).
    4. Do NOT
  importance: critical
  last_edited_ms: 0
