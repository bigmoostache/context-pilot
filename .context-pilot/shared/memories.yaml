M-long-5:
  tier: long
  title: 'DEPLOY TRAP (T687):'
  contents: |-
    DEPLOY TRAP (T687): source fix correct but fleet stale. system_reload re-execs agent from RELEASE binary, never restarts orchestrator; stale orch serde-drops unknown command fields. Deploy fresh binaries + restart orch, then VERIFY.

    Cost 4 false 'fixed' claims + a furious user.

    MECHANISM:
    - system_reload re-execs the AGENT from the active_tag RELEASE binary (~/.context-pilot/releases/<tag>/cpilot), NOT target/release/tui.
    - system_reload NEVER touches the orchestrator (M99: orchestrator = rebuild+RESTART).
    - Orchestrator typed-decodes POST /command via serde_json::from_slice::<Command>. serde SILENTLY DROPS unknown fields, so a stale orchestrator strips new command fields (e.g. initial_message) before the agent sees them. Symptom: 'thread created but message lost'.

    DEPLOY CHECKLIST after Rust source edit:
    1. cargo build --release.
    2. cp target/release/tui -> ~/.context-pilot/releases/<active_tag>/cpilot (active_tag in releases/config.json).
    3. cp target/release/cp-orchestrator -> ~/cp-server/bin/cp-orchestrator.
    4. Restart orchestrator: kill pid on :7878, relaunch from cwd ~/cp-server, env CP_WEB_ROOT=~/cp-server/web CP_BRIDGE=1 + BRAVE/VOYAGE/ANTHROPIC keys + PATH=/opt/homebrew/bin:... (M160 reap orphan meili).
    5. system_reload self to pick up fresh release binary.

    VERIFY:
    - strings <running-bi
  importance: critical
  last_edited_ms: 0
