M-long-10:
  tier: long
  title: 'CI Frontend red: exit-1'
  contents: |-
    CI Frontend red: `exit code 1` always prints after the LAST header (knip) because check-ts-lints.sh runs 8 sub-checks (eslint, prettier --check, stylelint, tsc -b, type-coverage, suppressions, rule-census, knip) with `|| fail=1` and exits at the end. The error's position says nothing about the culprit. Hit twice (T648, T672): knip blamed, prettier guilty, ~200 wasted calls.

    PROTOCOL:
    1. Fetch the full job log (REST /actions/jobs/<id>/logs if gh is unavailable).
    2. grep -n '=== ' to list every section header.
    3. Read the body between each pair of headers: prettier prints `[warn] <file>`, eslint rule violations, tsc `error TS####`.
    4. Fix the section that printed diagnostics, never the last one by default.
  importance: critical
  last_edited_ms: 1791290207511
