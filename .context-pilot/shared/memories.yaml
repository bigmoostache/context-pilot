  title: 'DEPLOY TRAP (T687):'
  contents: |-
    DEPLOY TRAP (T687): source fix correct but fleet stale → 4 false 'fixed' claims + furious user.

    MECHANISM:
    - system_reload re-execs the AGENT from the active_tag RELEASE binary (~/.context-pilot/releases/<tag>/cpilot), NOT target/release/tui.
    - system_reload never touches the orchestrator (orchestrator = rebuild + restart, M-mid-10).
    - Orchestrator decodes POST /command with serde, which SILENTLY DROPS unknown fields: a stale orch strips new command fields (e.g. initial_message). Symptom: 'thread created but message lost'.

    CHECKLIST after a Rust edit:
    1. cargo build --release.
    2. cp target/release/tui → ~/.context-pilot/releases/<active_tag>/cpilot (active_tag in releases/config.json). Back up the old one first.
    3. If orch changed: cp target/release/cp-orchestrator → ~/cp-server/bin/, kill pid on :7878, relaunch from ~/cp-server (env per M-mid-9), reap orphan meili (M-short-16).
    4. system_reload.

    VERIFY: `strings` the running binary for a marker from the new code before claiming it's shipped.
  importance: critical
  last_edited_ms: 1791290207510
