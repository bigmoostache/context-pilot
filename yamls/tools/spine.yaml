tools:
  notification_mark_processed:
    description: |
      Marks a spine notification as processed, indicating you've addressed it.
    parameters:
      ids: "Notification IDs to mark as processed (e.g., ['N1', 'N2'])"

  spine_configure:
    description: |
      Configures the spine module's auto-continuation guard rail. The only limit is max_auto_retries (consecutive auto-continuations without human input). It is optional — only provided values are changed. Pass null to disable.
    parameters:
      max_auto_retries: "Guard rail: max consecutive auto-continuations without human input. Null to disable."
      reset_counters: "Reset runtime counters (auto_continuation_count, autonomous_start_ms)"

  Coucou:
    description: |
      Schedules a reminder for an agent (default: you; any agent may be targeted). When it fires, the target gets a notification carrying the coucou id and the turn in the group. Give exactly one of delay, datetime (one-shot) or cron (recurring). Returns the id (coucou_<n>).
    parameters:
      message: "Message delivered when it fires"
      agent_id: "Target agent (A<n>). Default: you"
      group_id: "Group the reminder belongs to; you and the target must be members. Default: the target's human group"
      delay: "One-shot after a delay: '30s', '5m', '1h30m'"
      datetime: "One-shot at a local time: YYYY-MM-DDTHH:MM:SS (append Z for UTC)"
      cron: "Recurring, 5-field POSIX cron in local time: 'min hour day month weekday', e.g. '0 * * * *' hourly, '30 8 * * 1-5' weekdays 08:30"

  Coucou_delete:
    description: |
      Deletes a scheduled coucou. Only its creator or its target may. If the target deletes someone else's coucou, the creator is notified.
    parameters:
      coucou_id: "Coucou id (coucou_<n>)"
