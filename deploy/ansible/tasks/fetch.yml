---
# Fetch pre-built appliance artifacts from a GitHub Release onto the CONTROL
# node (no local build). The control node has internet; the offline LAN box does
# not, so we download here and ship over SSH.
#
# Pulls the aarch64-musl bundle (flat: cpilot, cp-console-server,
# cp-orchestrator, web/<spa> — no meilisearch, none is built upstream for musl)
# published by .github/workflows/release.yml, plus a stock Caddy arm64 binary.
# The systemd units + bootstrap Caddyfile come from the repo (templates/ +
# deploy/photonicat/Caddyfile), not the release.

- name: Ensure the artifacts dirs exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - "{{ artifacts_dir }}"
    - "{{ artifacts_dir }}/bundle"

# Resolve the artifact from the signed release CHANNEL (channels/<channel>.json)
# rather than GitHub's "latest" — latest can lag the channel (it was v0.1.0 while
# stable pinned v0.2.12). The manifest gives an exact, pinned URL + sha256, so the
# download is content-verified. (TODO: also verify the .minisig once the minisign
# pubkey is provisioned on the control node.)
- name: Resolve the release channel manifest ({{ cp_release }})
  ansible.builtin.uri:
    url: "{{ cp_channel_url }}"
    return_content: true
  register: _channel
  when: cp_release in ['stable', 'nightly']

- name: Pin the artifact URL + sha256 from the channel manifest
  ansible.builtin.set_fact:
    appliance_bundle_url: "{{ (_channel.content | from_json).artifacts['linux-aarch64-musl'].url }}"
    appliance_bundle_sha256: "{{ (_channel.content | from_json).artifacts['linux-aarch64-musl'].sha256 }}"
    cp_resolved_version: "{{ (_channel.content | from_json).version }}"
  when: cp_release in ['stable', 'nightly']

- name: Show the resolved release
  ansible.builtin.debug:
    msg: "channel={{ cp_release }} version={{ cp_resolved_version | default('n/a') }} url={{ appliance_bundle_url }}"
  when: cp_release in ['stable', 'nightly']

# `release=local` uses the bundle produced by deploy/photonicat/build.sh (when a
# GitHub release can't be cut yet); any other value downloads from GitHub.
- name: Download the appliance bundle ({{ cp_release }})
  ansible.builtin.get_url:
    url: "{{ appliance_bundle_url }}"
    dest: "{{ artifacts_dir }}/cpilot-linux-aarch64-musl.tar.gz"
    mode: "0644"
    force: true # always fetch the requested release's bundle
    checksum: "{{ ('sha256:' + appliance_bundle_sha256) if (appliance_bundle_sha256 is defined) else omit }}"
  when: cp_release != 'local'

- name: Verify an appliance bundle is present
  ansible.builtin.stat:
    path: "{{ artifacts_dir }}/cpilot-linux-aarch64-musl.tar.gz"
  register: bundle_stat

- name: Fail clearly when no bundle is available
  ansible.builtin.assert:
    that: bundle_stat.stat.exists
    fail_msg: >-
      No appliance bundle at {{ artifacts_dir }}/cpilot-linux-aarch64-musl.tar.gz.
      Either publish a release containing it, or run deploy/photonicat/build.sh
      and pass -e release=local.

- name: Extract the appliance bundle
  ansible.builtin.unarchive:
    src: "{{ artifacts_dir }}/cpilot-linux-aarch64-musl.tar.gz"
    dest: "{{ artifacts_dir }}/bundle"
    remote_src: true # the tarball is on the control node (this play is local)

- name: Download the Caddy arm64 binary (static Go; supports tls internal)
  ansible.builtin.get_url:
    url: "{{ caddy_url }}"
    dest: "{{ artifacts_dir }}/caddy"
    mode: "0755"
    force: false # build.sh / a prior run may have already provided it
