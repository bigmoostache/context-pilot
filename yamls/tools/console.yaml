tools:
  console_create:
    description: |
      Spawns a child process and creates a console panel to monitor its output. The process runs in the background and survives TUI reloads. Close the panel to kill the process. For one-shot commands (e.g. 'cargo build'), pass the full command directly — the panel shows output and exits when done. For interactive shells, pass 'bash' and use console_send_keys to run commands. For long-running servers (e.g. 'npm run dev'), use Monitor (type='command', mode='pattern') to get notified when ready.
    parameters:
      command: "Shell command to execute (e.g., 'npm run dev', 'cargo build 2>&1', 'bash')"
      cwd: "Working directory for the command (defaults to project root)"
      description: "Short description for the panel title"

  console_send_keys:
    description: |
      Sends input text to a running console's stdin. Use for interactive processes. Newline is NOT appended automatically — include \n if needed. Typical usage: send a command followed by \n (e.g. 'ls -la\n'). For interactive prompts, send the expected response (e.g. 'yes\n' or 'q'). Escape sequences are interpreted as control characters: \x03 (Ctrl+C to interrupt), \x04 (Ctrl+D for EOF), \e[A (up arrow), \n (newline), \t (tab), \xHH (arbitrary hex byte). To stop a process, send \x03 (Ctrl+C) or close the panel.
    parameters:
      id: "Console panel ID (e.g., 'P11')"
      input: "Text to send to stdin (e.g., 'cargo test\\n' or 'yes\\n')"

  console_wait:
    description: |
      Registers a waiter for a console event. Two modes: mode='exit': waits for the process to exit (use for builds, one-shot commands). mode='pattern': waits for a regex pattern to match in output (use for server ready messages, specific log lines). Patterns are full regex — e.g. 'Listening on port \d+', 'error|warning', 'Finished.*target'. Falls back to literal substring match if the regex is invalid. IMPORTANT: Include both success AND failure patterns using regex alternation (|) so you catch errors early instead of waiting for timeout. E.g. 'ready to accept|error|panic|failed'. BLOCKING: pauses tool execution until condition is met or max_wait expires. Best for sequential workflows (build then test). For async monitoring (long-running servers), use Monitor instead.
    parameters:
      id: "Console panel ID (e.g., 'P11')"
      mode: "Wait mode: 'exit' for process completion, 'pattern' for regex match in output"
      pattern: "Regex pattern to match in output (required when mode='pattern'). Use alternation to catch success AND failure: 'Listening on \\d+|error|panic|EADDRINUSE'. Falls back to literal match if invalid regex."
      max_wait: "Max wait in seconds, 1-60 (default: 60). On timeout, returns last output lines."

  Monitor:
    description: |
      Registers an async monitor on console output. You keep working; each event arrives as a spine notification labelled '[Monitor M<n> · <description>]'. type='console' attaches to an existing console panel (id); type='command' spawns the command into a new console panel first (shortcut for console_create + Monitor); type='ws' relays a websocket (ws_url, optional ws_send frame sent once on connect) through a websocat console, one message per line. mode='exit' fires when the process exits (frequency must be 'once'); mode='pattern' fires on new output lines matching a regex; mode='line' fires on every new non-empty line (the only mode for ws). Only output produced after registration counts. Lines are batched over 200ms into one notification; payloads over 8KB go to a /tmp/cp-monitor/*.log file and the notification shows its path and tail. frequency='once' ends the monitor after its first event; 'ongoing' keeps it until its console dies, its process exits, or it sends more than 20 events within one hour (flood: it is killed and you are told). Closing the console panel ends the monitor (you are notified). Live and recently ended monitors are listed in the Monitor panel. For blocking waits, use console_wait instead.
    parameters:
      type: "'console' (existing panel, needs id), 'command' (spawns command), or 'ws' (websocket, needs ws_url, mode='line' only)"
      description: "Short label repeated in every notification (e.g. 'dev server errors')"
      mode: "'exit' (process exit), 'pattern' (new lines matching pattern), or 'line' (every new line)"
      frequency: "'once' (end after first event) or 'ongoing' (keep firing; not allowed with mode='exit')"
      pattern: "Regex tested per line (mode='pattern' only). Use alternation for success AND failure: 'Listening on \\d+|error|panic'"
      id: "Console panel ID (type='console' only, e.g. 'P11')"
      command: "Shell command to spawn (type='command' only)"
      cwd: "Working directory for the command (type='command' only)"
      ws_url: "Websocket URL, ws:// or wss:// (type='ws' only)"
      ws_send: "Text frame sent once after connecting, e.g. a subscribe message (type='ws' only)"

  console_easy_bash:
    description: |
      Runs a shell command synchronously and returns stdout+stderr directly. No server, no background process — just exec and return. Use for debugging and quick one-off commands. BLOCKING: freezes tool execution until command completes (max 10s, then killed). Do NOT use for long-running or interactive commands — use console_create instead.
    parameters:
      command: "Shell command to execute (e.g., 'ls -la', 'cat /tmp/foo')"
      cwd: "Working directory (defaults to project root)"
