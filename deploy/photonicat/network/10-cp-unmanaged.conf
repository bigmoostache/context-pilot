# Context Pilot — the NetworkManager ↔ systemd-networkd seam.
# Shipped by deploy/ansible/tasks/net/network.yml BEFORE the network-manager
# package is installed. Do not edit by hand.
#
# THE ORDERING IS THE POINT, and it is the most dangerous ordering in this deploy
# tree. `apt-get install network-manager` starts NetworkManager from its postinst,
# and NM applies its device policy the instant it comes up. If this file is not
# already on disk at that moment there is no second chance: the damage is done
# before anything reads it.
#
# WHY: end0/end1 carry the fleet ULA — the deterministic, serial-derived address
# that is the ONLY day-0 and break-glass access path for the entire fleet. It is
# how we reach a box whose client LAN moved, whose DHCP lease changed, or that
# nobody can find. NetworkManager purges addresses it did not install itself,
# exactly as networkd does, so an NM that grabs end0 drops the ULA with it and the
# box is gone at the one address we can compute without asking anybody anything.
# Handing an ethernet port to a second stack puts the fleet's recovery path on the
# line for no benefit whatsoever. The `50-pcat-ula` NM dispatcher hook shipped by
# tasks/bringup.yml re-asserts the ULA if this is ever violated — a safety net,
# not a substitute for this file landing first.
#
# The two stacks therefore split by device: networkd keeps the ethernet, NM drives
# the modem (cdc-wdm0) and the AP radio (wlp1s0). They meet only in the kernel
# routing table, where a metric is a metric regardless of who installed it — end0
# sits at 100 (netplan's DHCP default), the `cp-wwan` bearer at 700 while standing
# by and 50 once it is the uplink.
#
# The globs cover the names the ethernet ports can take on this platform
# (end0/end1 today; lan*/wan* if a vendor image ever renames them). Neither
# `cdc-wdm0` nor `wlp1s0` matches, so both stay managed.
[keyfile]
unmanaged-devices=interface-name:end*;interface-name:lan*;interface-name:wan*

# DECIDED BY MEASUREMENT, on a real box, before the fleet was committed to it —
# getting this wrong costs the box its DNS the moment NM starts. With
# systemd-resolved active, `dns=systemd-resolved` leaves /etc/resolv.conf
# byte-identical across the install (md5 unchanged, still a symlink to
# /run/systemd/resolve/stub-resolv.conf) and resolution keeps working. The
# alternative — letting NM own resolv.conf — has it replace that symlink with a
# file of its own and end0 loses DNS. If a future image ever ships WITHOUT
# systemd-resolved, the correct value here is `dns=none`, not this one.
[main]
dns=systemd-resolved
