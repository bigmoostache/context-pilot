# Context Pilot — single-instance deployment.
#
#   cd deploy/docker
#   ./gen-secrets.sh                     # writes secrets/*.pw, prints them once
#   cp secrets/providers.env.example secrets/providers.env && $EDITOR secrets/providers.env
#   docker compose up -d
#
# Then open http://127.0.0.1:7878 and log in as the superadmin below; the first
# login forces a password change.
services:
  context-pilot:
    build:
      context: .
      # BUNDLE_SOURCE: local + a tarball in .artifacts/ to run an unreleased build.
      args:
        BUNDLE_SOURCE: release
    image: context-pilot:0.2.13
    restart: unless-stopped

    # LOOPBACK ON PURPOSE. Publishing on 0.0.0.0 serves the cockpit over plain
    # http:// to other machines, where crypto.randomUUID is undefined and every
    # agent command throws — the product looks broken, not insecure. To reach it
    # from another machine, put a TLS-terminating proxy in front and point it at
    # this container; do not widen this line.
    ports:
      - "127.0.0.1:7878:7878"

    environment:
      # First boot only — ignored once the user table is non-empty.
      CP_SEED_SUPERADMIN_EMAIL: vendor@example.com
      CP_SEED_SUPERADMIN_NAME: Vendor
      CP_SEED_SUPERADMIN_PASSWORD_FILE: /run/secrets/superadmin.pw
      # Optional: the customer's top account. Drop these three lines and a
      # superadmin can create it from the cockpit instead.
      CP_SEED_ADMIN_EMAIL: admin@example.com
      CP_SEED_ADMIN_NAME: Admin
      CP_SEED_ADMIN_PASSWORD_FILE: /run/secrets/admin.pw
      # Provider / integration API keys, read at every start (never persisted).
      CP_PROVIDERS_ENV_FILE: /run/secrets/providers.env

    # Passwords as files, never as environment variables: `docker inspect` shows
    # every env var to anyone who can reach the daemon, and the agents running
    # inside this container can read their own environment.
    secrets:
      - superadmin.pw
      - admin.pw
      - providers.env

    volumes:
      - cp-data:/data

    # This product runs arbitrary shell by design. None of these are optional in
    # a deployment anyone else can reach.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    mem_limit: 4g
    cpus: 2.0

secrets:
  superadmin.pw:
    file: ./secrets/superadmin.pw
  admin.pw:
    file: ./secrets/admin.pw
  providers.env:
    file: ./secrets/providers.env

volumes:
  cp-data:
