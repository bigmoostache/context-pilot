# Context Pilot — the NetworkManager ↔ systemd-networkd seam.
# Shipped by deploy/ansible/tasks/net/network.yml BEFORE the network-manager
# package is installed. Do not edit by hand.
#
# WHY (design-network-uplink §5, landmine 2): end0/end1 carry the fleet ULA —
# the deterministic, serial-derived address that is the ONLY day-0 and
# break-glass access path for the entire fleet. NetworkManager purges addresses
# it did not install itself, exactly as networkd does, so handing it an ethernet
# port would put the fleet's recovery path on the line for no benefit. The two
# stacks therefore split by device: networkd keeps the ethernet, NM drives the
# modem (cdc-wdm0) and the AP radio (wlp1s0). They meet only in the kernel
# routing table, where a metric is a metric regardless of who installed it.
#
# The globs cover the names the ethernet ports can take on this platform
# (end0/end1 today; lan*/wan* if a vendor image ever renames them). Neither
# `cdc-wdm0` nor `wlp1s0` matches, so both stay managed.
[keyfile]
unmanaged-devices=interface-name:end*;interface-name:lan*;interface-name:wan*

# DECIDED in M0/O0.3 and validated on hardware: with systemd-resolved active,
# `dns=systemd-resolved` leaves /etc/resolv.conf byte-identical (md5 unchanged)
# and DNS keeps working the moment NM starts. The alternative — letting NM own
# resolv.conf — loses DNS on end0 (landmine 3).
[main]
dns=systemd-resolved
